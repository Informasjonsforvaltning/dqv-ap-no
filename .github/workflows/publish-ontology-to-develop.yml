name: Publish ontology to GitHub pages

on:
  push:
    branches:
      - develop
    paths:
      - ontology/**
  workflow_dispatch:

jobs:
  build_html:
    runs-on: ubuntu-latest
    name: html build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodules to latest main
        run: |
          git submodule foreach --recursive git fetch origin
          git submodule foreach --recursive git checkout origin/main

      - name: Build html nb
        id: adocbuild_html_nb
        uses: tonynv/asciidoctor-action@master
        with:
          program: "asciidoctor -a data-uri -D ontology -o index.html -a lang=nb ontology/main-nb.adoc"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./ontology
          destination_dir: ./vocabulary
